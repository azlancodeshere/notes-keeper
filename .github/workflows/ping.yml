name: Ping Backend
 
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
 
jobs:
  ping:
    runs-on: ubuntu-latest
 
    steps:
      - name: Ping notes-keeper backend
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 \
            https://notes-keeper-4fw6.onrender.com/ > /dev/null
 